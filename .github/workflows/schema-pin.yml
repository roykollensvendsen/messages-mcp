name: schema-pin

# Nightly, and by hand: is the phone's sms_since answer schema on claude-voice-mobile's main still
# the file our copy is pinned to? A red run means it moved: read what changed, update sms-bridge if
# a field did, and move the pin (scripts/schema_pin.py says how). The repository is public, so
# the fetch needs no token.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

# A newer push to a pull request stops that pull request's stale run. Every other run, on
# main, a tag or by hand, is its own group and always runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing here writes to the repository, its issues or its packages.
permissions:
  contents: read

jobs:
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Standard library only, so the runner's own Python is enough.
      - run: python3 scripts/schema_pin.py upstream
